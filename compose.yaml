# Lokale Entwicklungsumgebung. Die Zugangsdaten gelten nur für diese Demo.
services:
  web:
    build: .
    ports:
      - "127.0.0.1:8000:80"
    volumes:
      - ./public:/var/www/html/public:ro
      - ./app:/var/www/html/app:ro
    environment:
      APP_ORIGIN: http://localhost:8000
      DB_DSN: mysql:host=db;port=3306;dbname=mma_projekt;charset=utf8mb4
      DB_USER: mma_projekt
      DB_PASSWORD: lokal-demo-passwort
    depends_on:
      db:
        condition: service_healthy
  db:
    image: mysql:8.4
    environment:
      MYSQL_DATABASE: mma_projekt
      MYSQL_USER: mma_projekt
      MYSQL_PASSWORD: lokal-demo-passwort
      MYSQL_ROOT_PASSWORD: lokal-demo-root-passwort
    volumes:
      - project-data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=$$MYSQL_PASSWORD mysql -h 127.0.0.1 -u$$MYSQL_USER $$MYSQL_DATABASE -e 'SELECT 1 FROM notes LIMIT 1' >/dev/null 2>&1"]
      interval: 3s
      timeout: 3s
      retries: 40
volumes:
  project-data:
